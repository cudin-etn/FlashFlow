<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="vibrantGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6" /> <stop offset="50%" style="stop-color:#3b82f6" /> <stop offset="100%" style="stop-color:#06b6d4" /> </linearGradient>

    <clipPath id="liquidClip">
      <circle cx="50" cy="50" r="42.5" />
    </clipPath>

    <style>
      /* Sóng sau: Di chuyển nhanh hơn (2.5s) */
      .wave-back {
        animation: slosh-back 2.5s ease-in-out infinite alternate;
      }
      /* Sóng trước: Di chuyển rất nhanh (1.8s) */
      .wave-front {
        animation: slosh-front 1.8s ease-in-out infinite alternate;
      }

      /* Tăng độ nghiêng (skew) để tạo cảm giác lắc mạnh hơn */
      @keyframes slosh-front {
        0% { transform: translateX(-35px) skewX(-8deg); }
        100% { transform: translateX(0px) skewX(8deg); }
      }
      @keyframes slosh-back {
        0% { transform: translateX(5px) skewX(6deg); }
        100% { transform: translateX(-35px) skewX(-6deg); }
      }
    </style>
  </defs>

  <circle cx="50" cy="50" r="43" fill="#0f172a" opacity="0.4" />

  <circle cx="50" cy="50" r="46.5" stroke="url(#vibrantGlow)" stroke-width="5" fill="none" />
  
  <circle cx="50" cy="50" r="43.5" stroke="#020617" stroke-width="1" fill="none" opacity="0.5"/>

  <g clip-path="url(#liquidClip)">
    <path class="wave-back" d="M-100,65 C -50,40 0,90 50,65 C 100,40 150,90 200,65 L 200,120 L -100,120 Z" fill="url(#vibrantGlow)" opacity="0.5" />
    
    <path class="wave-front" d="M-100,60 C -50,95 0,35 50,60 C 100,95 150,35 200,60 L 200,120 L -100,120 Z" fill="url(#vibrantGlow)" opacity="1" />
  </g>

  <ellipse cx="35" cy="32" rx="8" ry="4" fill="white" opacity="0.4" transform="rotate(-35 35 32)"/>
</svg>